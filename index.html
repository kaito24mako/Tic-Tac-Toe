<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header id="title-container">
        <h1>Tic Tac Toe</h1>
    </header>

    <span id="score-container">
        <div class="player1-group">
            <div id="player1Name"></div>
            <div id="player1Score"></div>
        </div>
        <p>vs</p>
        <div class="player2-group">
            <div id="player2Name"></div>
            <div id="player2Score"></div>
        </div>
    </span>

    <div id="gameboard-container">
        <div class="cell" id="one"></div>
        <div class="cell" id="two"></div>
        <div class="cell" id="three"></div>
        <div class="cell" id="four"></div>
        <div class="cell" id="five"></div>
        <div class="cell" id="six"></div>
        <div class="cell" id="seven"></div>
        <div class="cell" id="eight"></div>
        <div class="cell" id="nine"></div>
    </div>

    <button id="playBtn"></button>

    <dialog>
        <form method="post" id="form-container">
            <h1 id="form-title">Tic Tac Toe</h1>
            <div class="players-wrapper">
                <div class="player1-group">
                    <label for="player1">Player One</label>
                    <p>X</p>
                    <input type="text" id="player1" name="player1" placeholder="name" required>
                </div>
                <div class="player2-group">
                    <label for="player2">Player Two</label>
                    <p>O</p>
                    <input type="text" id="player2" name="player2" placeholder="name" required>
                </div>
            </div>
            <button type="submit" id="submitBtn">Confirm</button>
        </form>
    </dialog>

    <script src="./test.js" defer></script>
</body>
</html>
