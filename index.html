<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <span id="scores">
        <div class="player1-container">
            <div id="player1Name"></div>
            <div id="player1Score"></div>
        </div>
        <p>vs</p>
        <div class="player2-container">
            <div id="player2Name"></div>
            <div id="player2Score"></div>
        </div>
    </span>

    <div id="gameboard">
        <div class="cell" id="one"></div>
        <div class="cell" id="two"></div>
        <div class="cell" id="three"></div>
        <div class="cell" id="four"></div>
        <div class="cell" id="five"></div>
        <div class="cell" id="six"></div>
        <div class="cell" id="seven"></div>
        <div class="cell" id="eight"></div>
        <div class="cell" id="nine"></div>
    </div>

    <button id="nextRound"></button>

    <dialog>
        <form method="post" class="name-form">
            <h1>Tic Tac Toe</h1>
            <div class="player1">
                <label for="player1">Player One Name</label>
                <p>Marker: X</p>
                <input type="text" id="player1" name="player1" required>
            </div>
            <div class="player2">
                <label for="player2">Player Two Name</label>
                <p>Marker: O</p>
                <input type="text" id="player2" name="player2" required>
            </div>
            <button type="submit" id="submit-form">Confirm</button>
        </form>
    </dialog>

    <script src="./simplified.js" defer></script>
</body>
</html>
